<title>Welcome Welcome</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#000000;font-family:"Cinzel",Georgia,serif;overflow-x:hidden;color:#c0ccee}

/* ===== RPG BACKGROUND ===== */
#rpgBg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background: radial-gradient(ellipse at 30% 30%, rgba(20,20,40,.4) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 70%, rgba(15,15,30,.3) 0%, transparent 55%),
              linear-gradient(180deg, #000000 0%, #050508 50%, #000000 100%);}

/* Video nếu vẫn muốn dùng */
#videoBg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:1;pointer-events:none}
.video-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:2;pointer-events:none}

#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none}

/* ===== RPG FRAME ===== */
.rpg-frame{position:fixed;inset:0;z-index:3;pointer-events:none;
  border:1px solid rgba(200,200,220,.06);
  box-shadow:inset 0 0 120px rgba(0,0,0,.8);}
.rpg-corner{position:fixed;width:60px;height:60px;z-index:4;pointer-events:none;opacity:.6}
.rpg-corner svg{width:100%;height:100%}
.rpg-corner.tl{top:10px;left:10px}
.rpg-corner.tr{top:10px;right:10px;transform:scaleX(-1)}
.rpg-corner.bl{bottom:10px;left:10px;transform:scaleY(-1)}
.rpg-corner.br{bottom:10px;right:10px;transform:scale(-1)}

/* ===== VOLUME SLIDER ===== */
#volumeWrap{position:fixed;bottom:24px;right:24px;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border:1px solid rgba(150,160,200,.15);border-radius:0;padding:8px 16px;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);background:rgba(5,5,12,.9)}
#volumeIcon{font-size:1.1rem;cursor:pointer;user-select:none}
#volumeSlider{-webkit-appearance:none;width:90px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);outline:none;cursor:pointer}
#volumeSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer}
#volumeSlider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none}

/* ===== NHÂN VẬT ĐI BỘ ===== */
.walker{position:fixed;bottom:0px;z-index:5;pointer-events:none;height:120px;animation:walkAcross 18s linear infinite}
.walker img{height:100%;width:auto}
.walker.left-to-right{left:-150px;animation-name:walkLTR}
.walker.right-to-left{right:-150px;animation-name:walkRTL;transform:scaleX(-1)}
@keyframes walkLTR{0%{left:-150px}100%{left:calc(100vw + 150px)}}
@keyframes walkRTL{0%{right:-150px}100%{right:calc(100vw + 150px)}}
.content{position:relative;z-index:10;padding:0 0 60px}
header{text-align:center;padding:48px 20px 20px;position:relative}
header::before{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(150,170,220,.25),transparent)}
header h1{font-size:2.4rem;font-weight:700;letter-spacing:8px;text-transform:uppercase;
  color:#ffffff;
  text-shadow:0 0 10px rgba(255,255,255,.3),0 0 30px rgba(200,210,230,.15);
  font-family:Georgia,serif}
header p{margin-top:10px;font-size:.75rem;letter-spacing:4px;color:rgba(160,180,220,.35);text-transform:uppercase;font-family:Georgia,serif}

/* ===== NÚT FACEBOOK + INSTAGRAM ===== */
.fb-btn-wrap{display:flex;justify-content:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.fb-btn{display:flex;align-items:center;gap:10px;padding:10px 24px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(5,5,10,.85);
  color:#e0e0e8;font-size:.8rem;letter-spacing:2px;cursor:pointer;transition:all .3s;text-decoration:none;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  text-transform:uppercase;font-family:Georgia,serif}
.fb-btn:hover{background:rgba(15,15,20,.95);border-color:rgba(255,255,255,.3);color:#ffffff;transform:translateY(-2px);box-shadow:0 0 12px rgba(255,255,255,.07)}
.fb-btn svg{width:16px;height:16px;flex-shrink:0}
.ig-btn{display:flex;align-items:center;gap:10px;padding:10px 24px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(5,5,10,.85);
  color:#e0e0e8;font-size:.8rem;letter-spacing:2px;cursor:pointer;transition:all .3s;text-decoration:none;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  text-transform:uppercase;font-family:Georgia,serif}
.ig-btn:hover{background:rgba(15,15,20,.95);border-color:rgba(255,255,255,.3);color:#ffffff;transform:translateY(-2px);box-shadow:0 0 12px rgba(255,255,255,.07)}
.ig-btn svg{width:16px;height:16px;flex-shrink:0}

/* ===== ADMIN LOGIN ===== */
.admin-toggle{display:flex;justify-content:center;margin:10px 0 0}
.admin-toggle button{background:none;border:none;color:rgba(150,160,200,.2);font-size:.72rem;letter-spacing:3px;cursor:pointer;text-transform:uppercase;padding:6px 12px;transition:color .3s;font-family:Georgia,serif}
.admin-toggle button:hover{color:rgba(180,190,230,.5)}
.login-box{display:none;flex-direction:column;align-items:center;gap:10px;margin:14px 0;animation:fadeUp .3s ease}
.login-box.show{display:flex}
.login-box input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:30px;padding:9px 20px;color:#fff;font-size:.85rem;width:220px;outline:none;text-align:center;letter-spacing:2px}
.login-box input::placeholder{color:rgba(255,255,255,.3)}
.login-box input:focus{border-color:rgba(150,170,220,.4)}
.login-box button{padding:9px 28px;border-radius:30px;border:1px solid rgba(80,200,100,.4);background:rgba(0,60,30,.5);color:#ffffff;font-size:.8rem;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:all .3s}
.login-box button:hover{background:rgba(20,20,40,.9)}
.admin-badge{display:none;justify-content:center;margin:10px 0;gap:10px;align-items:center}
.admin-badge.show{display:flex}
.admin-badge span{font-size:.72rem;letter-spacing:2px;color:rgba(160,180,220,.6);text-transform:uppercase}
.admin-badge button{background:none;border:none;color:rgba(255,100,100,.5);font-size:.72rem;letter-spacing:1px;cursor:pointer;text-transform:uppercase;text-decoration:underline}

/* ===== UPLOAD (chỉ hiện khi admin) ===== */
.upload-zone{display:none;justify-content:center;margin:0 20px 32px}
.upload-zone.show{display:flex}
.upload-btn{display:flex;align-items:center;gap:10px;padding:13px 32px;border-radius:50px;border:1.5px dashed rgba(100,180,255,.45);background:rgba(100,180,255,.07);color:#a8d8ff;font-size:.88rem;letter-spacing:1px;cursor:pointer;transition:all .3s}
.upload-btn:hover{background:rgba(100,180,255,.15);border-color:rgba(100,180,255,.8)}
#fileInput{display:none}

/* ===== LOADING ===== */
.loading{text-align:center;padding:40px;color:rgba(150,160,200,.3);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;column-span:all}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(0,30,15,.95);border:1px solid rgba(80,200,100,.4);color:#ffffff;padding:12px 28px;border-radius:30px;font-size:.82rem;letter-spacing:1px;z-index:200;transition:transform .3s ease;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== GALLERY ===== */
.masonry-grid{columns:3;column-gap:13px;padding:0 18px;max-width:1100px;margin:0 auto}
@media(max-width:700px){.masonry-grid{columns:2}}
@media(max-width:420px){.masonry-grid{columns:1}}
.photo-card{break-inside:avoid;margin-bottom:13px;border-radius:13px;overflow:hidden;position:relative;border:1px solid rgba(150,160,200,.1);background:rgba(5,5,12,.7);animation:fadeUp .5s ease forwards;cursor:pointer;transition:transform .3s,box-shadow .3s}
.photo-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 8px 25px rgba(0,0,0,.6);border-color:rgba(150,170,220,.2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.photo-card img{width:100%;display:block;object-fit:cover}
.photo-overlay{position:absolute;bottom:0;left:0;right:0;padding:28px 12px 11px;background:linear-gradient(transparent,rgba(3,10,28,.85));opacity:0;transition:opacity .3s;display:flex;justify-content:space-between;align-items:flex-end}
.photo-card:hover .photo-overlay{opacity:1}
.photo-actions{display:flex;gap:7px}
.action-btn{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.action-btn:hover{background:rgba(255,80,80,.38);border-color:rgba(255,120,120,.75)}
.action-btn svg{width:13px;height:13px}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 20px;color:rgba(150,160,200,.15);column-span:all}
.empty-state svg{width:44px;height:44px;margin-bottom:14px;opacity:.28}
.empty-state p{font-size:.85rem;letter-spacing:2px;text-transform:uppercase}

/* ===== LIGHTBOX ===== */
.lightbox{position:fixed;inset:0;background:rgba(3,8,22,.93);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:85vh;border-radius:11px;object-fit:contain}
.lightbox-close{position:absolute;top:18px;right:22px;font-size:2rem;color:rgba(255,255,255,.45);cursor:pointer}
.lightbox-close:hover{color:white}
</style>
</head>

<script>
// ============================================================
//  CẤU HÌNH SUPABASE
// ============================================================
const SUPABASE_URL  = 'https://agaswpzosvtqqdpfzgpp.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnYXN3cHpvc3Z0cXFkcGZ6Z3BwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjI1OTksImV4cCI6MjA5NDYzODU5OX0.Zrf4Kpm7Dv2HgHoY1tQDhsImQ2PEbRJwm4fH4xZuUrY';
const ADMIN_PASSWORD = '@TeemoCute1349';
const BUCKET = 'photos';


const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
//  BACKGROUND: Sao + Sao băng + Mây + Doraemon
// ============================================================
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();

const stars = Array.from({length:220},()=>({x:Math.random()*3000,y:Math.random()*1400,r:Math.random()*1.1+.15,phase:Math.random()*Math.PI*2,spd:Math.random()*.6+.3}));
const shooters=[];
function spawnShooter(){const angle=(12+Math.random()*28)*Math.PI/180;const len=130+Math.random()*210;const spd=5+Math.random()*5;shooters.push({x:Math.random()*W*1.3,y:Math.random()*H*.4,dx:Math.cos(angle),dy:Math.sin(angle),len,spd,life:0,maxLife:len/spd});}

let t=0;
function loop(){
  t+=.016; ctx.clearRect(0,0,W,H);
  stars.forEach(s=>{const a=.12+Math.abs(Math.sin(t*s.spd+s.phase))*.65;ctx.beginPath();ctx.arc(s.x%W,s.y%(H*.9),s.r,0,Math.PI*2);const c=s.phase>3.14?'255,255,255':'220,225,235';ctx.fillStyle=`rgba(${c},${a})`;ctx.fill();});
  if(Math.random()<.012) spawnShooter();
  for(let i=shooters.length-1;i>=0;i--){const s=shooters[i];s.x+=s.dx*s.spd*4;s.y+=s.dy*s.spd*4;s.life++;const prog=s.life/s.maxLife;const alpha=prog<.2?prog/.2:prog>.7?1-(prog-.7)/.3:1;const tail=Math.min(s.life*s.spd*4,s.len);const tx=s.x-s.dx*tail,ty=s.y-s.dy*tail;const grd=ctx.createLinearGradient(tx,ty,s.x,s.y);grd.addColorStop(0,'rgba(255,255,255,0)');grd.addColorStop(.7,`rgba(255,255,255,${alpha*.5})`);grd.addColorStop(1,`rgba(255,255,255,${alpha})`);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.strokeStyle=grd;ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.arc(s.x,s.y,2,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fill();if(s.life>=s.maxLife)shooters.splice(i,1);}
  // Nebula
  const nb=ctx.createRadialGradient(W*.3,H*.3,0,W*.3,H*.3,W*.4);nb.addColorStop(0,'rgba(20,30,60,0.04)');nb.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=nb;ctx.fillRect(0,0,W,H);
  // Moon
  const mx=W*.78,my=H*.18,mr=W*.055;
  const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);
  mg.addColorStop(0,'rgba(220,225,240,0.18)');
  mg.addColorStop(0.6,'rgba(180,190,215,0.08)');
  mg.addColorStop(1,'rgba(100,110,140,0)');
  ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fillStyle=mg;ctx.fill();
  // Moon glow
  const mg2=ctx.createRadialGradient(mx,my,mr*.5,mx,my,mr*2.5);
  mg2.addColorStop(0,`rgba(180,190,220,${0.04+Math.sin(t*.2)*.01})`);
  mg2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(mx,my,mr*2.5,0,Math.PI*2);ctx.fillStyle=mg2;ctx.fill();
  requestAnimationFrame(loop);
}
loop();

// ============================================================
//  ADMIN AUTH
// ============================================================
let isAdmin = false;

function toggleLogin(){
  const box = document.getElementById('loginBox');
  box.classList.toggle('show');
  if(box.classList.contains('show')) document.getElementById('pwInput').focus();
}

function doLogin(){
  const pw = document.getElementById('pwInput').value;
  if(pw === ADMIN_PASSWORD){
    isAdmin = true;
    document.getElementById('loginBox').classList.remove('show');
    document.getElementById('adminBadge').classList.add('show');
    document.getElementById('uploadZone').classList.add('show');
    document.getElementById('pwInput').value = '';
    showToast('Đăng nhập thành công!');
    loadPhotos();
  } else {
    showToast('Sai mật khẩu!');
    document.getElementById('pwInput').value = '';
  }
}

function doLogout(){
  isAdmin = false;
  document.getElementById('adminBadge').classList.remove('show');
  document.getElementById('uploadZone').classList.remove('show');
  showToast('Đã đăng xuất');
  loadPhotos();
}

// ============================================================
//  SUPABASE: LOAD + UPLOAD + DELETE ẢNH
// ============================================================
async function loadPhotos(){
  document.getElementById('loadingEl').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
  document.querySelectorAll('.photo-card').forEach(c=>c.remove());

  const { data, error } = await supabaseClient
    .from('photos')
    .select('*')
    .order('created_at', { ascending: false });

  document.getElementById('loadingEl').style.display = 'none';

  if(error){ showToast('Lỗi tải ảnh!'); return; }
  if(!data || data.length === 0){
    document.getElementById('emptyState').style.display = 'block';
    return;
  }
  data.forEach((photo, idx) => addCard(photo, idx));
}

document.getElementById('fileInput').addEventListener('change', async e => {
  if(!isAdmin){ showToast('Bạn chưa đăng nhập!'); return; }
  const files = Array.from(e.target.files);
  for(const file of files){
    showToast('Đang upload ' + file.name + '...');
    const fileName = Date.now() + '_' + file.name.replace(/\s+/g,'_');

    // Upload lên Storage
    const { error: upErr } = await supabaseClient.storage
      .from(BUCKET)
      .upload(fileName, file, { cacheControl:'3600', upsert:false });

    if(upErr){ showToast('Upload thất bại: ' + file.name); continue; }

    // Lấy public URL
    const { data: urlData } = supabaseClient.storage.from(BUCKET).getPublicUrl(fileName);
    const url = urlData.publicUrl;

    // Lưu vào bảng photos
    const { error: dbErr } = await supabaseClient
      .from('photos')
      .insert({ url, name: file.name });

    if(dbErr){ showToast('Lưu DB thất bại!'); continue; }
    showToast('Upload thành công!');
  }
  e.target.value = '';
  loadPhotos();
});

async function deletePhoto(id, fileName){
  if(!isAdmin){ showToast('Bạn chưa đăng nhập!'); return; }

  // Xóa file khỏi storage
  const filePath = fileName.split('/').pop();
  await supabaseClient.storage.from(BUCKET).remove([filePath]);

  // Xóa record khỏi DB
  const { error } = await supabaseClient.from('photos').delete().eq('id', id);
  if(error){ showToast('Xóa thất bại!'); return; }
  showToast('Đã xóa ảnh');
  loadPhotos();
}

function addCard(photo, idx){
  const gallery = document.getElementById('gallery');
  const emptyEl = document.getElementById('emptyState');
  const card = document.createElement('div');
  card.className = 'photo-card';
  card.style.animationDelay = (idx * 0.05) + 's';

  const deleteBtn = isAdmin
    ? `<button class="action-btn" title="Xoá" onclick="deletePhoto('${photo.id}','${photo.url}');event.stopPropagation()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      </button>`
    : '';

  card.innerHTML = `
    <img src="${photo.url}" alt="${photo.name || ''}" loading="lazy">
    <div class="photo-overlay">
      <div class="photo-actions">
        <button class="action-btn" title="Xem" onclick="openLightbox('${photo.url}');event.stopPropagation()">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
        ${deleteBtn}
      </div>
    </div>`;
  gallery.insertBefore(card, emptyEl);
}

function openLightbox(url){
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

// ============================================================
//  TOAST
// ============================================================
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

// Load ảnh khi mở trang
loadPhotos();

// ===== AUDIO / VOLUME =====
const vid = document.getElementById('videoBg');
const music = document.getElementById('bgMusic');
const slider = document.getElementById('volumeSlider');
const icon = document.getElementById('volumeIcon');

vid.muted = true;
music.muted = false;
music.volume = 0.5;
slider.value = 0.5;
icon.textContent = '🔊';

// Đồng bộ nhạc với video
vid.addEventListener('play', () => { music.currentTime = vid.currentTime; music.play().catch(()=>{}); });
vid.addEventListener('pause', () => { music.pause(); });
vid.addEventListener('seeked', () => { music.currentTime = vid.currentTime; });
vid.addEventListener('timeupdate', () => {
  if(Math.abs(music.currentTime - vid.currentTime) > 0.3){
    music.currentTime = vid.currentTime;
  }
});

function playMusic(){
  music.muted = false;
  music.volume = Number(slider.value) || 0.5;
  music.currentTime = vid.currentTime;
  music.play().catch(()=>{});
}

window.addEventListener('load', playMusic);
document.addEventListener('click', playMusic, { once: true });

slider.addEventListener('input', () => {
  const value = Number(slider.value);
  music.volume = value;
  music.muted = value === 0;
  if(value === 0) icon.textContent = '🔇';
  else if(value < 0.5) icon.textContent = '🔉';
  else icon.textContent = '🔊';
  music.play().catch(()=>{});
});

icon.addEventListener('click', (e) => {
  e.stopPropagation();
  if(music.muted || music.volume === 0){
    music.muted = false;
    music.volume = 0.5;
    slider.value = 0.5;
    icon.textContent = '🔊';
    music.play().catch(()=>{});
  } else {
    music.muted = true;
    slider.value = 0;
    icon.textContent = '🔇';
  }
});
</script>
